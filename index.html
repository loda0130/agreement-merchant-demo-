<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>协议管理中心</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="workspace">
        <header class="header">
          <div class="header-left">
            <a class="brand" href="#/protocols" aria-label="协议管理中心首页"><span class="brand-mark">P</span><span>协议管理中心</span></a>
            <div class="header-divider"></div>
            <div class="crumb"><span>运营管理</span><span class="slash">/</span><strong id="crumb-current">协议管理</strong></div>
          </div>
          <div class="header-actions">
            <button class="icon-button" id="notice-button" aria-label="通知"><span class="notification-dot"></span>♧</button>
            <button class="help-button">? <span>帮助中心</span></button>
            <button class="profile" id="profile-button"><span class="avatar">王</span><span>运营管理员</span><span class="chevron">⌄</span></button>
          </div>
        </header>

        <section class="content" id="app-content"></section>
      </main>
    </div>
    <div class="toast" role="status" aria-live="polite" id="toast"></div>
    <script src="./app.js"></script>
  </body>
</html>
